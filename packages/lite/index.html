<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenCode Lite JS</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
      }

      body {
        margin: 0;
        background: #111827;
        color: #f9fafb;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 14px;
      }

      input,
      textarea,
      button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #1f2937;
        color: inherit;
        padding: 12px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        cursor: pointer;
      }

      pre {
        margin: 0;
        padding: 16px;
        border-radius: 8px;
        background: #0f172a;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenCode Lite JS</h1>
      <p>Early no-build playground for the JavaScript runtime.</p>
      <label>
        OpenRouter API key
        <input id="apiKey" placeholder="sk-or-v1-...">
      </label>
      <label>
        Model
        <input id="model" value="openrouter/auto">
      </label>
      <label>
        Prompt
        <textarea id="prompt">List the files in the workspace and summarize what you find.</textarea>
      </label>
      <button id="run">Run agent</button>
      <label>
        Result
        <pre id="result"></pre>
      </label>
      <label>
        Workspace snapshot
        <pre id="workspace"></pre>
      </label>
    </main>
    <script type="module">
      import { createAgent } from "./agent.js"
      import { createOpenRouterProvider } from "./providers.js"
      import { createLocalStorageStorage } from "./storage.js"
      import { createWorkspaceTools } from "./tools.js"
      import { createMemoryWorkspace } from "./workspace.js"

      const apiKeyInput = document.querySelector("#apiKey")
      const modelInput = document.querySelector("#model")
      const promptInput = document.querySelector("#prompt")
      const resultOutput = document.querySelector("#result")
      const workspaceOutput = document.querySelector("#workspace")

      const workspace = createMemoryWorkspace({
        "README.md": "# Demo workspace\n\nThis is a browser-only prototype.",
        "src/agent.js": "export function runAgent() {}",
      })
      const storage = createLocalStorageStorage()
      const tools = createWorkspaceTools()

      workspaceOutput.textContent = JSON.stringify(await workspace.snapshot(), null, 2)

      const savedApiKey = localStorage.getItem("opencode-lite:api-key")
      if (savedApiKey) {
        apiKeyInput.value = savedApiKey
      }

      document.querySelector("#run").addEventListener("click", async () => {
        localStorage.setItem("opencode-lite:api-key", apiKeyInput.value)
        resultOutput.textContent = "Running..."

        const agent = createAgent({
          provider: createOpenRouterProvider({
            apiKey: apiKeyInput.value,
            model: modelInput.value,
          }),
          storage,
          workspace,
          tools,
          permissions: {
            read: "allow",
            list: "allow",
            search: "allow",
            write: "deny",
            edit: "deny",
          },
        })

        try {
          const result = await agent.run(promptInput.value, {
            sessionId: "browser-playground",
          })
          resultOutput.textContent = result
          workspaceOutput.textContent = JSON.stringify(await workspace.snapshot(), null, 2)
        } catch (error) {
          resultOutput.textContent = error.message
        }
      })
    </script>
  </body>
</html>
